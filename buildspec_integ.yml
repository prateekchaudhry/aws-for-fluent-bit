version: 0.2
phases:
  install:
    runtime-versions:
      golang: 1.23
  pre_build:
    commands:
      - echo Running the integration test
  build:
    commands:
      # Check BUILD_VERSION environment variable and set default if not provided
      - |
        if [ -z "$BUILD_VERSION" ]; then
          echo "BUILD_VERSION environment variable not provided, defaulting to BUILD_VERSION=2"
          export BUILD_VERSION=2
        else
          echo "BUILD_VERSION is set to: $BUILD_VERSION"
        fi
      # Execute integration test commands based on BUILD_VERSION
      - |
        # Common setup for all versions
        export AWS_STS_REGIONAL_ENDPOINTS=regional
        export CW_INTEG_VALIDATOR_IMAGE_BASE=${AWS_ACCOUNT}.dkr.ecr.us-west-2.amazonaws.com/cw-integ-validator
        export S3_INTEG_VALIDATOR_IMAGE_BASE=${AWS_ACCOUNT}.dkr.ecr.us-west-2.amazonaws.com/s3-integ-validator
        
        # Get the default credentials and set as environment variables
        CREDS=`curl 169.254.170.2$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI`
        export AWS_ACCESS_KEY_ID=`echo $CREDS | jq -r .AccessKeyId`
        export AWS_SECRET_ACCESS_KEY=`echo $CREDS | jq -r .SecretAccessKey`
        export AWS_SESSION_TOKEN=`echo $CREDS | jq -r .Token`

        # ECR login
        aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com

        if [ "$BUILD_VERSION" = "2" ]; then
          echo "Running integration tests for AWS for Fluent Bit version 2"
          
          # Pull and tag the version 2 image (uses 'latest' manifest tag)
          docker pull ${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon/aws-for-fluent-bit-test:latest
          docker tag ${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon/aws-for-fluent-bit-test:latest amazon/aws-for-fluent-bit:latest

          # List the images to do a double check
          docker images

          # Command to run the integration test for version 2
          make integ BUILD_VERSION=2
          
        elif [ "$BUILD_VERSION" = "3" ]; then
          echo "Running integration tests for AWS for Fluent Bit version 3"
          
          # Pull and tag the version 3 image (uses 'latest-3' manifest tag)
          docker pull ${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon/aws-for-fluent-bit-test:latest-3
          docker tag ${AWS_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon/aws-for-fluent-bit-test:latest-3 amazon/aws-for-fluent-bit:latest

          # List the images to do a double check
          docker images

          # Command to run the integration test for version 3
          make integ BUILD_VERSION=3
          
        else
          echo "Unsupported BUILD_VERSION: $BUILD_VERSION"
          echo "Supported versions are: 2, 3"
          exit 1
        fi
artifacts:
  files:
    - '**/*'
